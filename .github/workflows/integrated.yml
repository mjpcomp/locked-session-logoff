# Updated: 2026-10-15 15:48 America/Los_Angeles
# Path: .github/workflows/integrated.yml; Owner: maintainers
# Permissions: contents read; Purpose: fake-backend outcome tests plus disabled lifecycle/retention smoke
# Arguments: none; Usage: push/PR/manual dispatch; never enables live actions
name: Integrated service test bundle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate XML and scripts
        shell: pwsh
        run: |
          Get-ChildItem src,tests -Recurse -File | Where-Object { $_.Extension -in '.csproj','.manifest' } | ForEach-Object {$null=[xml](Get-Content $_.FullName -Raw)}
          Get-ChildItem packaging -Filter *.ps1 | ForEach-Object {$tokens=$null;$errors=$null;$null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors);if($errors.Count){throw ($errors | Out-String)}}
      - name: Core tests
        run: dotnet run --project tests/LockedSessionLogoff.SelfTests -c Release
      - name: Configuration tests
        run: dotnet run --project tests/LockedSessionLogoff.ConfigurationTests -c Release
      - name: Identity/eligibility tests (no real actions)
        run: dotnet run --project tests/LockedSessionLogoff.EligibilityTests -c Release
      - name: Diagnostics tests (no external state)
        run: dotnet run --project tests/LockedSessionLogoff.DiagnosticsTests -c Release
      - name: Action/outcome tests (fake backend only)
        run: dotnet run --project tests/LockedSessionLogoff.ActionTests -c Release
      - name: Publish service and GUI
        shell: pwsh
        run: |
          dotnet publish src/LockedSessionLogoff.Service -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishTrimmed=false -o artifacts/package/service
          if($LASTEXITCODE){exit $LASTEXITCODE}
          dotnet publish src/LockedSessionLogoff.Admin -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishTrimmed=false -o artifacts/package/admin
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Copy-Item packaging/*.ps1 artifacts/package/
          Copy-Item SERVICE-INTEGRATION.md artifacts/package/
          @{Runtime='${{ matrix.runtime }}';Commit='${{ github.sha }}'} | ConvertTo-Json | Set-Content artifacts/package/package.json
      - name: x64 disabled install/restart/history/uninstall smoke test
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          & ./artifacts/package/service/LockedSessionLogoff.Service.exe --self-check
          if($LASTEXITCODE){exit $LASTEXITCODE}
          & ./artifacts/package/Install.ps1 -Confirm:$false
          try {
            Start-Sleep -Seconds 5
            if((Get-Service LockedSessionLogoff).Status -ne 'Running'){throw 'Service not running'}
            $r=(Get-ItemProperty 'HKLM:\SOFTWARE\LockedSessionLogoff.Runtime').StatusV1 | ConvertFrom-Json
            $c=(Get-ItemProperty 'HKLM:\SOFTWARE\LockedSessionLogoff').ConfigurationV1 | ConvertFrom-Json
            if($r.Configuration.Enabled -ne $false -or $c.AllowLiveLogoff -eq $true){throw 'Installation activated monitoring/live permit'}
            if(@($r.RetainedEvents).Count -lt 1){throw 'No retained diagnostics'}
            $oldRun=$r.RunId
            Restart-Service LockedSessionLogoff
            Start-Sleep -Seconds 5
            $r=(Get-ItemProperty 'HKLM:\SOFTWARE\LockedSessionLogoff.Runtime').StatusV1 | ConvertFrom-Json
            if($r.RunId -eq $oldRun -or $r.Configuration.Enabled -ne $false){throw 'Restart identity/disabled state incorrect'}
            if(@($r.RetainedEvents | Where-Object RunId -eq $oldRun).Count -lt 1){throw 'Prior run diagnostics lost'}
          } finally { & ./artifacts/package/Uninstall.ps1 -Confirm:$false }
          if(Test-Path 'HKLM:\SOFTWARE\LockedSessionLogoff.Runtime'){throw 'Owned runtime/history remains'}
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/package -File -Recurse | Sort-Object FullName | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, [IO.Path]::GetRelativePath((Resolve-Path artifacts/package).Path,$_.FullName) } | Set-Content artifacts/SHA256SUMS.txt
          Move-Item artifacts/SHA256SUMS.txt artifacts/package/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-test-${{ matrix.runtime }}
          path: artifacts/package/
          if-no-files-found: error
