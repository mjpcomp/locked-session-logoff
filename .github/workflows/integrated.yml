# Updated: 2026-10-20 13:32 America/Los_Angeles
# Path: .github/workflows/integrated.yml; Owner: maintainers
# Permissions: contents read; Purpose: hosted disabled policy compilation, client tools and dual-shell lifecycle
# Arguments: none; Usage: disposable x64 install tests never enable monitoring/live
name: Integrated service test bundle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate XML and scripts
        shell: pwsh
        run: |
          Get-ChildItem src,tests -Recurse -File | Where-Object { $_.Extension -in '.csproj','.manifest' } | ForEach-Object {$null=[xml](Get-Content $_.FullName -Raw)}
          Get-ChildItem packaging,tests -Filter *.ps1 -Recurse | ForEach-Object {$tokens=$null;$errors=$null;$null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors);if($errors.Count){throw ($errors | Out-String)}}
      - name: Core tests
        run: dotnet run --project tests/LockedSessionLogoff.SelfTests -c Release
      - name: Configuration tests
        run: dotnet run --project tests/LockedSessionLogoff.ConfigurationTests -c Release
      - name: Identity/eligibility tests
        run: dotnet run --project tests/LockedSessionLogoff.EligibilityTests -c Release
      - name: Diagnostics tests
        run: dotnet run --project tests/LockedSessionLogoff.DiagnosticsTests -c Release
      - name: Action/outcome tests (fake backend only)
        run: dotnet run --project tests/LockedSessionLogoff.ActionTests -c Release
      - name: Agent protocol/policy tests
        run: dotnet run --project tests/LockedSessionLogoff.AgentPolicyTests -c Release
      - name: Hosting policy remains disabled tests
        run: dotnet run --project tests/LockedSessionLogoff.HostedPolicyTests -c Release
      - name: Idle timer tests
        run: dotnet run --project tests/LockedSessionLogoff.IdleTests -c Release
      - name: Publish service, GUI and manual agent tools
        shell: pwsh
        run: |
          dotnet publish src/LockedSessionLogoff.Service -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishTrimmed=false -o artifacts/package/service
          if($LASTEXITCODE){exit $LASTEXITCODE}
          dotnet publish src/LockedSessionLogoff.Admin -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishTrimmed=false -o artifacts/package/admin
          if($LASTEXITCODE){exit $LASTEXITCODE}
          dotnet publish src/LockedSessionLogoff.SessionAgent -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishTrimmed=false -o artifacts/package/agent-tools
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Copy-Item packaging/*.ps1 artifacts/package/
          Copy-Item SERVICE-INTEGRATION.md,AGENT-POLICY.md artifacts/package/
          @{Runtime='${{ matrix.runtime }}';Commit='${{ github.sha }}'} | ConvertTo-Json | Set-Content artifacts/package/package.json
      - name: x64 native layouts only
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          & ./artifacts/package/service/LockedSessionLogoff.Service.exe --self-check
          if($LASTEXITCODE){exit $LASTEXITCODE}
          & ./artifacts/package/agent-tools/LockedSessionLogoff.SessionAgent.exe --self-check
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Windows PowerShell 5.1 preview/integrity/lifecycle regression
        if: matrix.runtime == 'win-x64'
        shell: powershell
        run: '& ./tests/PackagingLifecycle.ps1 -PackageRoot ./artifacts/package -ExpectedMajor 5'
      - name: PowerShell 7 preview/integrity/lifecycle regression
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: '& ./tests/PackagingLifecycle.ps1 -PackageRoot ./artifacts/package -ExpectedMajor 7'
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/package -File -Recurse | Sort-Object FullName | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, [IO.Path]::GetRelativePath((Resolve-Path artifacts/package).Path,$_.FullName) } | Set-Content artifacts/SHA256SUMS.txt
          Move-Item artifacts/SHA256SUMS.txt artifacts/package/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-test-${{ matrix.runtime }}
          path: artifacts/package/
          if-no-files-found: error
