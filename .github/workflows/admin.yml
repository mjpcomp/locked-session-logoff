# Created: 2026-10-15 10:46 America/Los_Angeles
# Path: .github/workflows/admin.yml; Owner: maintainers
# Permissions: contents read; Purpose: package elevated configuration UI
# Arguments: none; Usage: push/PR/manual dispatch
name: Administrator utility packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate project and manifest XML
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.csproj', '.manifest' } | ForEach-Object {
            $null = [xml](Get-Content -LiteralPath $_.FullName -Raw)
          }
      - name: Existing core regression tests
        run: dotnet run --project tests/LockedSessionLogoff.SelfTests/LockedSessionLogoff.SelfTests.csproj -c Release
      - name: Publish administrator UI
        run: dotnet publish src/LockedSessionLogoff.Admin/LockedSessionLogoff.Admin.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishTrimmed=false -o artifacts/admin
      - name: Guide and checksums
        shell: pwsh
        run: |
          Copy-Item ADMIN.md artifacts/admin/ADMIN.md
          Get-ChildItem artifacts/admin -File -Recurse | Sort-Object FullName | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash, [IO.Path]::GetRelativePath((Resolve-Path artifacts/admin).Path, $_.FullName)
          } | Set-Content artifacts/SHA256SUMS.txt
          Move-Item artifacts/SHA256SUMS.txt artifacts/admin/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: admin-${{ matrix.runtime }}
          path: artifacts/admin/
          if-no-files-found: error
# No GUI interaction, registry writes or service installation occur in this workflow.
